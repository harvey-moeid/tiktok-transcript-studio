name: Package check
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CHECK to build and pack without publishing"
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    if: inputs.confirm == 'CHECK'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
